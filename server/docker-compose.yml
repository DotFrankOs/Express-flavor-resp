services:
  db:
    image: postgres:15-alpine
    container_name: ef_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expressuser
      POSTGRES_PASSWORD: expresspass
      POSTGRES_DB: expressflavor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expressuser -d expressflavor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ef_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: expressuser
      DB_PASS: expresspass
      DB_NAME: expressflavor
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

volumes:
  postgres_data:

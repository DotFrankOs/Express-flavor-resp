<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas - Express Flavor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/reservations.css">
  <link rel="stylesheet" href="styles/alert-style.css">
  <link rel="stylesheet" href="styles/app-header.css">
  <script type="module" src="components/app-header.js"></script>
</head>
<body class="restaurant-selection">
  <app-header></app-header>

  <main class="reservations-main">
    <div class="reservations-layout">
      <section class="reservations-list-section">
        <div class="reservations-section-header">
          <h2>
            <img src="images/svg/calendar-icon.svg" alt="" class="section-icon">
            Mis Reservas
          </h2>
        </div>
        <div id="reservations-list-container">
          <div class="reservations-loading">
            <div class="spinner"></div>
            <p>Cargando tus reservas...</p>
          </div>
        </div>
      </section>

      <aside class="reservations-summary-section">
        <div class="summary-card sticky">
          <h3>Resumen</h3>
          
          <div class="summary-row">
            <span>Total reservas</span>
            <span id="stat-total-reservations">0</span>
          </div>
          <div class="summary-row">
            <span>Activas</span>
            <span id="stat-active-reservations" class="stat-highlight">0</span>
          </div>
          <div class="summary-row">
            <span>Pasadas</span>
            <span id="stat-past-reservations">0</span>
          </div>
          <div class="summary-row">
            <span>Canceladas</span>
            <span id="stat-cancelled-reservations">0</span>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-row total">
            <span>Gasto total en reservas</span>
            <span id="stat-total-spent">C$0.00</span>
          </div>

          <div class="next-reservation-section" id="next-reservation-box" style="display:none;">
            <h4>
              <img src="images/svg/clock-icon.svg" alt="" class="section-icon-sm">
              Próxima reserva
            </h4>
            <div class="next-reservation-card" id="next-reservation-content">
            </div>
          </div>

          <a href="restaurantes.html" class="continue-shopping">
            <img src="images/svg/arrow-left-icon.svg" alt="" class="btn-icon-sm">
            Hacer nueva reserva
          </a>
        </div>
      </aside>
    </div>
  </main>

  <div id="cancel-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box cancel-box">
      <div class="modal-header">
        <img src="images/svg/alert-triangle-icon.svg" alt="" class="modal-title-icon">
        <h3>Cancelar reserva</h3>
      </div>
      <p id="cancel-message">¿Estás seguro de cancelar esta reserva?</p>
      <div class="form-group">
        <label>Motivo de cancelación</label>
        <textarea id="cancel-reason" rows="3" placeholder="Describe el motivo..."></textarea>
      </div>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="btn-primary">Sí, cancelar</button>
        <button id="close-cancel-btn" class="btn-secondary">Volver</button>
      </div>
    </div>
  </div>

  <div id="ticket-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box ticket-box">
      <div class="modal-header">
        <img src="images/svg/success-icon.svg" alt="" class="modal-title-icon">
        <h3>Ticket de Reserva</h3>
      </div>
      <div class="ticket-content" id="ticket-content">
      </div>
      <div class="modal-actions">
        <button id="print-ticket-btn" class="btn-primary">
          <img src="images/svg/orders-icon.svg" alt="" class="btn-icon-sm">
          Imprimir
        </button>
        <button id="close-ticket-btn" class="btn-secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/handlers/reservations-handler.js"></script>
</body>
</html>

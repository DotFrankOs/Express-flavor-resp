<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Staff - Express Flavor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="styles/app-header.css">
  <link rel="stylesheet" href="styles/staff-dashboard.css">
  <link rel="stylesheet" href="styles/alert-style.css">
  <script type="module" src="components/app-header.js"></script>
</head>

<body class="staff-panel">
  <app-header></app-header>

  <main class="staff-main">
    <header class="staff-restaurant-header">
      <img id="restaurant-logo" src="" alt="" class="staff-logo">
      <div class="staff-restaurant-info">
        <h1 id="restaurant-name">Cargando...</h1>
        <span id="staff-role" class="staff-role-badge">Rol</span>
      </div>
      <div class="staff-live-indicator">
        <span class="live-dot"></span>
        En vivo
      </div>
    </header>

    <section class="staff-stats-grid">
      <div class="staff-stat-card">
        <img src="images/svg/orders-icon.svg" alt="" class="stat-icon">
        <div class="stat-value" id="stat-today-orders">0</div>
        <div class="stat-label">Pedidos hoy</div>
      </div>
      <div class="staff-stat-card">
        <img src="images/svg/money-icon.svg" alt="" class="stat-icon">
        <div class="stat-value" id="stat-today-revenue">C$0</div>
        <div class="stat-label">Ingresos hoy</div>
      </div>
      <div class="staff-stat-card">
        <img src="images/svg/pending-icon.svg" alt="" class="stat-icon">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pendientes</div>
      </div>
      <div class="staff-stat-card">
        <img src="images/svg/calendar-icon.svg" alt="" class="stat-icon">
        <div class="stat-value" id="stat-reservations">0</div>
        <div class="stat-label">Reservas activas</div>
      </div>
    </section>

    <div class="staff-tabs">
      <button class="staff-tab active" data-tab="orders">
        <img src="images/svg/orders-icon.svg" alt="" class="tab-icon">
        Pedidos
      </button>
      <button class="staff-tab" data-tab="reservations">
        <img src="images/svg/calendar-icon.svg" alt="" class="tab-icon">
        Reservas
      </button>
      <button class="staff-tab" data-tab="stats">
        <img src="images/svg/chart-icon.svg" alt="" class="tab-icon">
        Estadísticas
      </button>
      <button class="staff-tab" data-tab="menu">
        <img src="images/svg/food-icon.svg" alt="" class="tab-icon">
        Menú
      </button>
    </div>

    <section class="staff-tab-content active" id="tab-orders">
      <div class="staff-section-header">
        <h2>Pedidos de hoy</h2>
        <div class="staff-filters">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="processing">En preparación</button>
          <button class="filter-btn" data-filter="delivering">En camino</button>
        </div>
      </div>
      <div id="orders-list" class="staff-orders-list">
        <div class="staff-loading">
          <div class="spinner"></div>
          <p>Cargando pedidos...</p>
        </div>
      </div>
    </section>

    <section class="staff-tab-content" id="tab-reservations">
      <div class="staff-section-header">
        <h2>Reservas activas</h2>
        <span id="current-date"></span>
      </div>
      <div id="reservations-list" class="staff-reservations-list">
        <div class="staff-loading">
          <div class="spinner"></div>
          <p>Cargando reservas...</p>
        </div>
      </div>
    </section>

    <section class="staff-tab-content" id="tab-stats">
      <div class="staff-section-header">
        <h2>Productos más vendidos</h2>
      </div>
      <div id="top-items-list" class="staff-top-items">
        <div class="staff-loading">
          <div class="spinner"></div>
          <p>Cargando estadísticas...</p>
        </div>
      </div>
    </section>

    <section class="staff-tab-content" id="tab-menu">
      <div class="staff-section-header">
        <h2>Gestión del Menú</h2>
        <button class="btn-primary" id="add-menu-item-btn">+ Agregar Item</button>
      </div>
      <div id="menu-items-list" class="staff-menu-list">
        <!-- Se renderiza dinámicamente -->
      </div>
    </section>
  </main>

  <div id="status-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box status-modal-box">
      <h3>Actualizar estado</h3>
      <p id="status-order-info">Pedido #---</p>

      <div class="status-options">
        <button class="status-option" data-status="pending">
          <span class="status-dot pending"></span>
          Pendiente
        </button>
        <button class="status-option" data-status="processing">
          <span class="status-dot processing"></span>
          En preparación
        </button>
        <button class="status-option" data-status="delivering">
          <span class="status-dot delivering"></span>
          En camino
        </button>
        <button class="status-option" data-status="delivered">
          <span class="status-dot delivered"></span>
          Entregado
        </button>
        <button class="status-option issue" data-status="issue">
          <span class="status-dot issue"></span>
          Inconveniente
        </button>
      </div>

      <div class="form-group" id="issue-note-group" style="display:none;">
        <label>Motivo del inconveniente</label>
        <textarea id="issue-note" rows="3" placeholder="Describe el problema..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="confirm-status-btn" class="btn-primary">Guardar</button>
        <button id="cancel-status-btn" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="menu-item-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box menu-modal-box">
      <h3 id="menu-modal-title">Agregar Item</h3>

      <div class="form-group">
        <label>ID único <span style="color:#ef4444">*</span> <small>(ej: b6, i3, m4)</small></label>
        <input type="text" id="menu-item-id" placeholder="b6" required>
      </div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="menu-item-name" placeholder="Nombre del producto">
      </div>

      <div class="form-group">
        <label>Precio base</label>
        <input type="number" id="menu-item-price" step="0.01" placeholder="0.00">
      </div>

      <div class="form-group">
        <label>Imagen (ruta relativa)</label>
        <input type="text" id="menu-item-image" placeholder="carpeta/imagen.png">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea id="menu-item-desc" rows="2"></textarea>
      </div>

      <div class="modal-actions">
        <button id="confirm-menu-btn" class="btn-primary">Guardar</button>
        <button id="cancel-menu-btn" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/handlers/staff-handler.js"></script>
</body>

</html>

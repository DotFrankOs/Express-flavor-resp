services:
  db:
    image: postgres:15-alpine
    container_name: ef_postgres_local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./server/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ef_backend_local
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/backend/src:/app/src
      - ./public:/app/public
      - ./server/backend/logs:/app/logs
      - ./server/backend/prisma:/app/prisma

volumes:
  postgres_data_local:

